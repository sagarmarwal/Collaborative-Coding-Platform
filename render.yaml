services:
  - type: web
    name: collaborative-coding-platform
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: PISTON_API_URL
        fromService:
          type: web
          name: piston-api
          property: host
      - key: PISTON_API_PORT
        value: "2000"
    healthCheckPath: /
    
  - type: web
    name: piston-api
    env: image
    plan: starter # Disks require a paid plan
    image:
        url: ghcr.io/engineer-man/piston:latest
    disk:
      name: piston-data
      mountPath: /tmp/piston # Adjust this path to wherever Piston needs write access
      sizeGB: 10
    envVars:
      - key: PORT
        value: "2000"
    
  - type: redis
    name: coding-platform-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow connections from app service