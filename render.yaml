services:
  - type: web
    name: collaborative-coding-platform
    env: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: PISTON_API_URL
        fromService:
          type: web
          name: piston-api
          property: host
    healthCheckPath: /
    
  - type: web
    name: piston-api
    env: image
    plan: free
    image:
      url: ghcr.io/engineer-man/piston:latest
    autoDeploy: false
    # This command creates a writable area in /tmp and links Piston's 
    # required folders to it before the app starts.
    startCommand: |
      mkdir -p /tmp/piston/isolate /tmp/piston/jobs && \
      ln -s /tmp/piston/isolate /piston/isolate && \
      ln -s /tmp/piston/jobs /piston/jobs && \
      ./piston start
    envVars:
      - key: PORT
        value: "2000"
    healthCheckPath: /api/v1/health
    
  - type: redis
    name: coding-platform-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow connections from app service