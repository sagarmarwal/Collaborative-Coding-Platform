services:
  - type: web
    name: collaborative-coding-platform
    env: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: PISTON_API_URL
        fromService:
          type: web
          name: piston-api
          property: host
      - key: PISTON_API_PORT
        value: "2000"
    healthCheckPath: /
    
  - type: web
    name: piston-api
    env: image
    plan: free # No billing required
    image:
      url: ghcr.io/engineer-man/piston:latest
    autoDeploy: false
    envVars:
      - key: PORT
        value: "2000"
      # This tells Piston to use the writable /tmp directory
      - key: PISTON_DATA_PATH
        value: /tmp/piston
      - key: PISTON_RUN_PATH
        value: /tmp/piston/run
    healthCheckPath: /api/v1/health
    
  - type: redis
    name: coding-platform-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow connections from app service